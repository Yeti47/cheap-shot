# Copy to compose.yaml (gitignored) and adjust.
#
# Prerequisite on the HOST -- a container cannot load a kernel module:
#   sudo modprobe v4l2loopback exclusive_caps=1 card_label=cheap-shot
services:
  cheap-shot:
    build: .
    image: cheap-shot
    # Host networking is required for `discover`: UDP broadcast does not cross
    # Docker's bridge NAT, and the camera sits on the host's own AP-side
    # subnet (192.168.9.0/24). For a fixed-IP camera you may instead use
    # bridge networking with `ports: ["8080:8080"]` and
    # CHEAPSHOT_LISTEN=0.0.0.0:8080.
    network_mode: host
    devices:
      - "/dev/video10:/dev/video10"
    group_add:
      - video
    volumes:
      # Device secrets stay on the host, read-only, never in the image.
      - ./config.json:/config.json:ro
    environment:
      CHEAPSHOT_LISTEN: "127.0.0.1:8080"
      # Alternatively, drop the volume above entirely and pass everything here:
      # CHEAPSHOT_CAM1_HOST: "192.168.9.252"
      # CHEAPSHOT_CAM1_DID: "<PRODUCT_KEY>"
      # CHEAPSHOT_CAM1_SCODE: "<PRODUCT_SECRET>"
      # CHEAPSHOT_CAM1_V4L2_DEVICE: "/dev/video10"
    restart: unless-stopped
